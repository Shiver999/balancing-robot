name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds need repository read access only; they do not publish or flash hardware.
permissions:
  contents: read

jobs:
  # Host fixtures check real protocol, safety and sensor algorithms with sanitizers.
  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests with sanitizers
        run: cmake -S firmware/test/host -B firmware/test/host/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build firmware/test/host/build --parallel 2
      - name: Test protocol, leases, replay protection, startup and sensors
        run: ctest --test-dir firmware/test/host/build --output-on-failure

  # Compile the default ESP32-S3 image with acquisition disabled.
  firmware-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware

  # Also compile opt-in acquisition so target-only SPI and logging code stays covered.
  firmware-sensor-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py -B build-sensor-bench -D SDKCONFIG=sdkconfig.sensor-bench -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.sensor-bench.defaults" build

  # Build the debug APK and run JVM protocol tests against the pinned SDK/JDK.
  firmware-ble-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py -B build-ble-bench -D SDKCONFIG=sdkconfig.ble-bench -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ble-bench.defaults" build

  firmware-imu-i2c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py -B build-imu-i2c -D SDKCONFIG=sdkconfig.imu-i2c -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.imu-i2c.defaults" build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build APK and run protocol tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
